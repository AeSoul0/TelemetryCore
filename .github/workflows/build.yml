name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  # PC simulation: build with -Werror, run unit + integration tests, run the simulator.
  host:
    name: Host build & tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake --preset host-debug -DTELEMETRY_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset host-debug

      - name: Unit tests
        run: ctest --preset host-debug

      - name: Simulator smoke test (frames checked by the ground station)
        run: |
          ./build/host-debug/bsp/host/telemetry_sim --duration-ms 3000 \
            | python3 tools/ground_station/ground_station.py --stdin --check

      - name: Upload compile database
        uses: actions/upload-artifact@v4
        with:
          name: compile-commands
          path: build/host-debug/compile_commands.json

  # Static analysis and formatting on project sources (third-party code is excluded).
  quality:
    name: Static analysis & format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cppcheck
          pip install clang-format==19.1.7 clang-tidy==19.1.0

      - name: Architecture rule - app/ is platform independent
        run: |
          if grep -rnE '#include *[<"](stm32|FreeRTOS|task\.h|thread|mutex|iostream|string|sstream|functional)' app/; then
            echo "::error::app/ must only depend on the OSAL and driver interfaces"
            exit 1
          fi

      - name: clang-format
        run: git ls-files '*.c' '*.cpp' '*.h' | xargs clang-format --dry-run --Werror

      - name: Configure (compile database)
        run: cmake --preset host-debug

      - name: clang-tidy
        run: |
          git ls-files 'app/*.cpp' 'platform/src/*.cpp' 'platform/osal_host/*.cpp' \
                       'drivers/mock/*.cpp' 'drivers/host/*.cpp' 'bsp/host/*.cpp' \
            | xargs clang-tidy -p build/host-debug --quiet

      - name: cppcheck
        run: |
          cppcheck --std=c++17 --enable=warning,performance,portability --inline-suppr \
            --error-exitcode=1 --suppress=missingIncludeSystem \
            -I platform/include -I platform/osal_host/include -I drivers/include \
            -I drivers/mock/include -I drivers/host/include -I app/include \
            app platform/src platform/osal_host drivers/mock drivers/host bsp/host

  # STM32 firmware: cross-compile Debug and Release images and publish them.
  firmware:
    name: Firmware (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        preset: [ stm32-debug, stm32-release ]
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM GNU toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '14.2.Rel1'

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Cache third-party sources (HAL, CMSIS, FreeRTOS)
        uses: actions/cache@v4
        with:
          path: build/${{ matrix.preset }}/_deps
          key: deps-${{ matrix.preset }}-${{ hashFiles('cmake/stm32_dependencies.cmake') }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DTELEMETRY_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Size report
        run: |
          {
            echo "### Firmware size (${{ matrix.preset }})"
            echo '```'
            arm-none-eabi-size --format=berkeley build/${{ matrix.preset }}/bsp/nucleo_f446re/telemetry_fw.elf
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: telemetry_fw-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/bsp/nucleo_f446re/telemetry_fw.elf
            build/${{ matrix.preset }}/bsp/nucleo_f446re/telemetry_fw.hex
            build/${{ matrix.preset }}/bsp/nucleo_f446re/telemetry_fw.bin
            build/${{ matrix.preset }}/bsp/nucleo_f446re/telemetry_fw.map

  # Ground station: protocol parser unit tests.
  ground-station:
    name: Ground station tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tools/ground_station -v
